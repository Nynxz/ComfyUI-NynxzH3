# Packaging + Python tooling. The pack's RUNTIME identity (namespace, category, routes) lives
# in pack.json, not here — see framework/identity.py. What's below is registry metadata and
# linting.

[project]
name = "comfyui-nynxzh3"  # the Registry id: fixed, since installs track it
version = "0.1.0"
description = "A production pack for MiniMax H3 in ComfyUI: H3 Studio (write a film as scenes, render it in one loop), Grey Box Studio (block scenes in 3D), the Codex (a show's characters and places), and the H3 conditioning, prompt and sampling nodes underneath."
authors = [{ name = "Nynxz", email = "contact@nynxz.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = []
dependencies = []

[project.urls]
Repository = "https://github.com/Nynxz/ComfyUI-NynxzH3Studio"
BugTracker = "https://github.com/Nynxz/ComfyUI-NynxzH3Studio/issues"

[tool.comfy]
PublisherId = "nynxz"
Banner = "https://raw.githubusercontent.com/Nynxz/ComfyUI-NynxzH3/main/docs/images/banner.webp"
DisplayName = "Nynxz H3 Studio"
Icon = "https://avatars.githubusercontent.com/u/60878743?v=4"
Tags = ["video", "minimax", "h3", "studio", "storyboard", "3d", "conditioning", "reference"]
Repository = "https://github.com/Nynxz/ComfyUI-NynxzH3Studio"
# `web/` is built from `frontend/` (`pnpm build`) and gitignored, so a publish must build first;
# this ships the built bundle with the pack.
includes = ["web"]


# Linting / formatting. Run with `uvx ruff check` and `uvx ruff format`
# (uv is already available; no project install needed).
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["web", "temp", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "BLE", # flake8-blind-except (the `# noqa: BLE001` sites opt into this)
    "RUF", # ruff-specific rules
]
# `ruff format` owns code line width; E501 only fires on comments/docstrings/long
# tooltip strings it deliberately leaves alone, so linting it here is just noise.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The rewriter's system prompt is vendored verbatim from the LoRA repo, en dashes and all.
# Normalising them to hyphens would edit the string the adapter was trained on.
"nodes/rewrite/_prompt.py" = ["RUF001"]

[tool.ruff.format]
docstring-code-format = true
