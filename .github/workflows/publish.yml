name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Nynxz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff
      - run: pnpm install --frozen-lockfile
      # The same checks as CI, then the editors' bundle the pack ships in web/.
      - run: pnpm check
      - run: test -f web/main.js

      # comfy-cli archives git-TRACKED files only, and web/ is gitignored. Staging is
      # enough — `git ls-files` reads the index, so nothing is committed or pushed.
      - run: git add -f web

      - run: pip install comfy-cli

      # Invoked directly rather than via publish-node-action: that action runs its own checkout
      # with clean:true, which would delete the staged bundle.
      - name: Publish to the ComfyUI registry
        run: comfy node publish --token "$REGISTRY_TOKEN"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
